name: Build AI Abeeclip APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK Components
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build Complete AI Video Studio App with Subtitle Templates
        env:
          API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir project
          unzip -o AI_Abeeclip_Android_Phone_Build.zip -d project
          
          # 1. Tambahkan library OkHttp
          sed -i '/dependencies {/a \    implementation("com.squareup.okhttp3:okhttp:4.12.0")' project/app/build.gradle.kts
          
          # 2. Pastikan izin Internet aktif di AndroidManifest.xml
          if ! grep -q "android.permission.INTERNET" project/app/src/main/AndroidManifest.xml; then
            sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />' project/app/src/main/AndroidManifest.xml
          fi

          # 3. Buat GeminiHelper.kt (Multimodal AI Analyzer)
          cat << 'EOF' > project/app/src/main/java/com/abeeclip/app/GeminiHelper.kt
          package com.abeeclip.app

          import android.content.Context
          import android.net.Uri
          import android.util.Base64
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import okhttp3.MediaType.Companion.toMediaType
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import okhttp3.RequestBody.Companion.toRequestBody
          import org.json.JSONArray
          import org.json.JSONObject
          import java.util.concurrent.TimeUnit

          object GeminiHelper {
              private const val API_KEY = "PLACEHOLDER_API_KEY"
              private val client = OkHttpClient.Builder()
                  .connectTimeout(90, TimeUnit.SECONDS)
                  .readTimeout(90, TimeUnit.SECONDS)
                  .writeTimeout(90, TimeUnit.SECONDS)
                  .build()

              suspend fun analyzeVideo(context: Context, videoUri: Uri, taskPrompt: String): String = withContext(Dispatchers.IO) {
                  try {
                      val inputStream = context.contentResolver.openInputStream(videoUri)
                          ?: return@withContext "Gagal membaca file video dari penyimpanan."
                      
                      val bytes = inputStream.readBytes()
                      inputStream.close()

                      if (bytes.size > 15 * 1024 * 1024) {
                          return@withContext "Ukuran video terlalu besar (${bytes.size / (1024 * 1024)} MB). Gunakan video di bawah 15 MB untuk pemrosesan AI."
                      }

                      val base64Video = Base64.encodeToString(bytes, Base64.NO_WRAP)
                      val mimeType = context.contentResolver.getType(videoUri) ?: "video/mp4"

                      val url = "https://googleapis.com"
                      
                      val jsonBody = JSONObject().apply {
                          put("contents", JSONArray().apply {
                              put(JSONObject().apply {
                                  put("parts", JSONArray().apply {
                                      put(JSONObject().apply {
                                          put("inline_data", JSONObject().apply {
                                              put("mime_type", mimeType)
                                              put("data", base64Video)
                                          })
                                      })
                                      put(JSONObject().apply {
                                          put("text", taskPrompt)
                                      })
                                  })
                              })
                          })
                      }

                      val request = Request.Builder()
                          .url(url)
                          .post(jsonBody.toString().toRequestBody("application/json".toMediaType()))
                          .build()

                      client.newCall(request).execute().use { response ->
                          val body = response.body?.string() ?: return@withContext "Respons kosong dari AI"
                          if (!response.isSuccessful) {
                              return@withContext "Gagal menghubungi Gemini (${response.code}). Pastikan API Key valid."
                          }
                          val jsonResponse = JSONObject(body)
                          val candidates = jsonResponse.optJSONArray("candidates")
                          val content = candidates?.optJSONObject(0)?.optJSONObject("content")
                          val parts = content?.optJSONArray("parts")
                          return@withContext parts?.optJSONObject(0)?.optString("text") ?: "Tidak ada hasil teks dari AI."
                      }
                  } catch (e: Exception) {
                      return@withContext "Terjadi kesalahan: ${e.localizedMessage}"
                  }
              }
          }
          EOF

          sed -i "s/PLACEHOLDER_API_KEY/$API_KEY/g" project/app/src/main/java/com/abeeclip/app/GeminiHelper.kt

          # 4. Buat VideoExportHelper.kt
          cat << 'EOF' > project/app/src/main/java/com/abeeclip/app/VideoExportHelper.kt
          package com.abeeclip.app

          import android.content.ContentValues
          import android.content.Context
          import android.net.Uri
          import android.os.Build
          import android.os.Environment
          import android.provider.MediaStore
          import androidx.annotation.OptIn
          import androidx.media3.common.Effect
          import androidx.media3.common.MediaItem
          import androidx.media3.common.util.UnstableApi
          import androidx.media3.effect.Crop
          import androidx.media3.effect.Presentation
          import androidx.media3.transformer.Composition
          import androidx.media3.transformer.EditedMediaItem
          import androidx.media3.transformer.Effects
          import androidx.media3.transformer.ExportException
          import androidx.media3.transformer.ExportResult
          import androidx.media3.transformer.Transformer
          import java.io.File

          object VideoExportHelper {

              fun saveSrtToDownloads(context: Context, srtContent: String): String {
                  return try {
                      val fileName = "Abeeclip_Subtitle_${System.currentTimeMillis()}.srt"
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          val values = ContentValues().apply {
                              put(MediaStore.Downloads.DISPLAY_NAME, fileName)
                              put(MediaStore.Downloads.MIME_TYPE, "application/x-subrip")
                              put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS)
                          }
                          val uri = context.contentResolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values)
                              ?: return "Gagal membuat file di folder Downloads."
                          context.contentResolver.openOutputStream(uri)?.use { out ->
                              out.write(srtContent.toByteArray())
                          }
                      } else {
                          val dir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS)
                          val file = File(dir, fileName)
                          file.writeText(srtContent)
                      }
                      "File SRT berhasil disimpan di folder Downloads ($fileName)!"
                  } catch (e: Exception) {
                      "Gagal menyimpan file SRT: ${e.localizedMessage}"
                  }
              }

              @OptIn(UnstableApi::class)
              fun exportVideoMp4(
                  context: Context,
                  videoUri: Uri,
                  offsetX: Float,
                  aspectRatio: String,
                  onSuccess: (String) -> Unit,
                  onError: (String) -> Unit
              ) {
                  try {
                      val tempOutputFile = File(context.cacheDir, "abeeclip_render_${System.currentTimeMillis()}.mp4")
                      val shift = (offsetX / 220f).coerceIn(-0.45f, 0.45f)
                      val cropEffect = when (aspectRatio) {
                          "9:16" -> Crop((-0.56f + shift).coerceIn(-1f, 0.4f), (0.56f + shift).coerceIn(-0.4f, 1f), -1f, 1f)
                          "1:1" -> Crop((-0.75f + shift).coerceIn(-1f, 0.2f), (0.75f + shift).coerceIn(-0.2f, 1f), -1f, 1f)
                          else -> Crop(-1f, 1f, -1f, 1f)
                      }

                      val targetHeight = when (aspectRatio) {
                          "9:16" -> 1280
                          "1:1" -> 1080
                          else -> 720
                      }

                      val effectsList = listOf<Effect>(
                          cropEffect,
                          Presentation.createForHeight(targetHeight)
                      )

                      val mediaItem = MediaItem.fromUri(videoUri)
                      val editedMediaItem = EditedMediaItem.Builder(mediaItem)
                          .setEffects(Effects(emptyList(), effectsList))
                          .build()

                      val transformer = Transformer.Builder(context)
