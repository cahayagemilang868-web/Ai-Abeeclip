name: Build AI Abeeclip APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK Components
        run: |
          # Menggunakan sdkmanager bawaan GitHub runner untuk memasang platform & build-tools
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: |
          mkdir project
          unzip -o AI_Abeeclip_Android_Phone_Build.zip -d project
          find project -name build.gradle.kts

      - name: Build APK
        run: |
          cd project
          # Membuat file local.properties agar Gradle mengetahui lokasi Android SDK bawaan
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          
          # Menggunakan gradlew bawaan project (jika ada) atau gradle sistem
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Abeeclip-APK
          path: project/**/build/outputs/apk/debug/*.apk
