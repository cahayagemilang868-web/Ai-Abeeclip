name: Build AI Abeeclip APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup SDK
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Prepare Project
        env:
          API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p project
          unzip -o AI_Abeeclip_Android_Phone_Build.zip -d project
          sed -i '/dependencies {/a \    implementation("com.squareup.okhttp3:okhttp:4.12.0")' project/app/build.gradle.kts
          grep -q "android.permission.INTERNET" project/app/src/main/AndroidManifest.xml || sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />' project/app/src/main/AndroidManifest.xml
          cp -f src_files/*.kt project/app/src/main/java/com/abeeclip/app/
          sed -i "s/PLACEHOLDER_API_KEY/$API_KEY/g" project/app/src/main/java/com/abeeclip/app/GeminiHelper.kt
      - name: Build APK
        run: |
          cd project
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug -Pkotlin.jvm.target.validation.mode=ignore
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Abeeclip-APK
          path: project/**/build/outputs/apk/debug/*.apk
